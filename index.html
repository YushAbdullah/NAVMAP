<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NAVMAP · Malaysia live map</title>
  <meta name="description" content="Navigate Malaysia with live flood, weather and earthquake alerts. Find EV chargers, fuel, food, toilets and surau near you.">
  <meta name="theme-color" content="#F6FEF6">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Font loads without blocking the first paint (system font shows until it arrives) -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap"></noscript>
  <!-- Start the map connection while the app code downloads -->
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link rel="preload" as="fetch" href="https://tiles.openfreemap.org/styles/positron" crossorigin>
</head>
<body>
  <div id="app">
    <div id="map" role="region" aria-label="Map"></div>

    <!-- Top: search, chips, then one banner (an alert near you, otherwise a news headline) -->
    <div class="top">
      <form class="search" id="search-form" role="search" autocomplete="off">
        <span class="brand" aria-hidden="true"><i></i><i></i></span>
        <label for="q" class="sr-only" data-i18n="searchLabel">Search places</label>
        <input id="q" type="search" data-i18n-ph="searchPh" placeholder="Search places, address, EV…" enterkeyhint="search">
        <button type="button" class="icon-btn" id="lang-btn" aria-label="Switch language">BM</button>
      </form>
      <ul class="results" id="results" role="listbox" hidden></ul>

      <p class="offline-pill" id="offline-pill" role="status" hidden></p>

      <div class="chips" id="chips" role="toolbar" aria-label="Find nearby"></div>

      <div class="news-bar" id="news-bar" hidden>
        <button class="news-bar-main" id="news-bar-main">
          <span class="nb-tag" id="news-bar-tag">NEWS</span>
          <span class="nb-txt" id="news-bar-txt"></span>
        </button>
        <button class="nb-x" id="news-bar-x" aria-label="Hide news headlines"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>

      <button class="banner" id="banner" hidden>
        <span class="banner-ic" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        </span>
        <span class="banner-txt"><b id="banner-title"></b><small id="banner-sub"></small></span>
        <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </div>

    <!-- Emergency calls button (always on the map) -->
    <button class="sos-fab" id="sos-btn" aria-label="Emergency calls" data-i18n-aria="sosTitle">SOS</button>

    <!-- Current conditions: weather and air pollution in one card -->
    <div class="conds" id="conds" role="group" aria-label="Weather and air" data-i18n-aria="condsTitle" hidden>
      <button class="fab wx-fab" id="wx-btn" hidden></button>
      <button class="fab wx-fab aq-fab" id="aq-btn" hidden></button>
    </div>

    <!-- Map tools (rain radar lives in the Map layers menu) -->
    <div class="fabs">
      <button class="fab" id="alerts-layer-btn" aria-label="Map layers" data-i18n-aria="layersTitle" aria-haspopup="true" aria-expanded="false" aria-controls="layers-pop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/></svg>
      </button>
      <button class="fab radio-fab" id="radio-btn" aria-label="Radio" data-i18n-aria="radioTitle" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8 17 3"/><circle cx="15.5" cy="14" r="2.5"/><path d="M6.5 12h4M6.5 16h4"/></svg><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <button class="fab" id="report-btn" aria-label="Pin weather or hazard" data-i18n-aria="report">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V4h12l-1.5 4L16 12H4"/></svg>
      </button>
      <button class="fab" id="locate-btn" aria-label="Centre on my location" data-i18n-aria="locate">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8-8-2z"/></svg>
      </button>
    </div>

    <!-- Play view: points and level -->
    <button class="score-chip" id="score-chip" hidden></button>

    <!-- Navigation HUD (active guidance) -->
    <div class="hud" id="hud" hidden>
      <div class="hud-step">
        <span class="hud-ic" id="hud-ic" aria-hidden="true"></span>
        <div class="hud-main"><b id="hud-dist"></b><span id="hud-text"></span></div>
        <button class="hud-voice" id="hud-voice" aria-pressed="true" aria-label="Mute voice"></button>
        <button class="hud-voice hud-radio" id="hud-radio" aria-label="Radio" data-i18n-aria="radioTitle" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8 17 3"/><circle cx="15.5" cy="14" r="2.5"/><path d="M6.5 12h4M6.5 16h4"/></svg></button>
        <button class="hud-voice hud-voice-pick" id="hud-voice-pick" aria-label="Voice style" data-i18n-aria="voiceStyle" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h2M8 8v8M12 5v14M16 8v8M20 11v2"/></svg></button>
      </div>
      <div class="hud-road" id="hud-road"></div>
      <div class="hud-haz" id="hud-haz" role="status" hidden></div>
      <div class="hud-meta"><span id="hud-eta"></span><button class="btn-danger" id="hud-stop" data-i18n="stop">End</button></div>
    </div>

    <!-- Bottom sheet -->
    <section class="sheet" id="sheet" aria-live="polite">
      <button class="grab" id="grab" aria-label="Expand or collapse panel"><span></span></button>
      <div class="sheet-body" id="sheet-body"></div>
      <nav class="tabs" aria-label="Main">
        <button data-tab="explore" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg>
          <span data-i18n="tabExplore">Explore</span>
        </button>
        <button data-tab="weather">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19 10a4 4 0 0 1-1 8z"/></svg>
          <span data-i18n="tabWeather">Weather</span>
        </button>
        <button data-tab="drive">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8-8-2z"/></svg>
          <span data-i18n="tabDrive">Drive</span>
        </button>
        <button data-tab="news">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h13v14a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v10a2 2 0 0 1-2 2"/><path d="M7 9h7M7 13h7M7 17h4"/></svg>
          <span data-i18n="tabNews">News</span>
        </button>
        <button data-tab="alerts">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
          <span data-i18n="tabAlerts">Alerts</span>
          <em class="badge" id="badge" hidden>0</em>
        </button>
      </nav>
    </section>

    <!-- Map layers menu -->
    <div id="layers-pop" class="layers-pop" role="dialog" aria-labelledby="layers-title" hidden>
      <h3 id="layers-title" data-i18n="layersTitle">Map layers</h3>
      <div class="lp-types" role="radiogroup" aria-labelledby="layers-title">
        <button type="button" role="radio" data-basemap="map" aria-checked="true"><span class="lp-thumb lp-map"></span><span data-i18n="layerMap">Map</span></button>
        <button type="button" role="radio" data-basemap="play" aria-checked="false"><span class="lp-thumb lp-play"></span><span data-i18n="layerPlay">Play</span></button>
      </div>
      <label class="lp-row"><input type="checkbox" id="lp-alerts" checked><span data-i18n="layerAlerts">Alerts and pins on map</span></label>
      <label class="lp-row"><input type="checkbox" id="lp-radar"><span data-i18n="radarOn">Show rain radar</span></label>
    </div>

    <!-- Report dialog -->
    <dialog id="report-dlg" aria-labelledby="report-title">
      <form method="dialog" id="report-form">
        <h2 id="report-title" data-i18n="reportTitle">What's happening here?</h2>
        <p class="muted" data-i18n="reportHint">Your pin is shown to everyone nearby. You can remove it any time.</p>
        <label class="report-note"><span data-i18n="reportNote">Add a detail (optional)</span>
          <input id="report-note" type="text" maxlength="200" autocomplete="off" placeholder="e.g. left lane blocked, water rising" data-i18n-ph="reportNotePh"></label>
        <div class="report-grid" id="report-grid"></div>
        <div class="row-end">
          <button value="cancel" class="btn-ghost" data-i18n="cancel">Cancel</button>
        </div>
      </form>
    </dialog>

    <!-- Community: register, sign in or stay anonymous -->
    <dialog id="join-dlg" class="join-dlg" aria-labelledby="join-title"><div id="join-body"></div></dialog>

    <!-- Email updates sign-up -->
    <dialog id="sub-dlg" aria-labelledby="sub-title">
      <form id="sub-form" novalidate>
        <h2 id="sub-title" data-i18n="subTitle">Get NAVMAP updates</h2>
        <p class="muted" data-i18n="subLead">News about new features, safety tips and future NAVMAP campaigns, by email. No spam.</p>
        <label class="sub-field"><span data-i18n="subEmail">Email address</span>
          <input type="email" id="sub-email" autocomplete="email" inputmode="email" required placeholder="nama@contoh.com"></label>
        <label class="sub-consent"><input type="checkbox" id="sub-consent"> <span id="sub-consent-txt"></span></label>
        <p class="sub-msg" id="sub-msg" role="status"></p>
        <div class="row-end">
          <button type="button" class="btn-ghost" id="sub-cancel" data-i18n="cancel">Cancel</button>
          <button type="submit" class="btn" id="sub-submit" disabled data-i18n="subBtn">Subscribe</button>
        </div>
        <p class="sub-foot"><button type="button" class="linkish" id="sub-unsub" data-i18n="subUnsubLink">Unsubscribe an email</button></p>
      </form>
    </dialog>

    <!-- Emergency calls -->
    <dialog id="sos-dlg" class="sos-dlg" aria-labelledby="sos-title">
      <div class="sos-head">
        <h2 id="sos-title" data-i18n="sosTitle">Emergency calls</h2>
        <button class="icon-btn" id="sos-close" aria-label="Close" data-i18n-aria="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div id="sos-body"></div>
    </dialog>

    <!-- Voice style picker -->
    <dialog id="voice-dlg" class="sos-dlg voice-dlg" aria-labelledby="voice-title">
      <div class="sos-head">
        <h2 id="voice-title" data-i18n="voiceStyle">Voice style</h2>
        <button class="icon-btn" id="voice-close" aria-label="Close" data-i18n-aria="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div id="voice-body" class="voice-body"></div>
    </dialog>

    <!-- Free radio -->
    <dialog id="radio-dlg" class="sos-dlg radio-dlg" aria-labelledby="radio-title">
      <div class="sos-head">
        <h2 id="radio-title" data-i18n="radioTitle">Radio</h2>
        <button class="icon-btn" id="radio-close" aria-label="Close" data-i18n-aria="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div id="radio-now" class="radio-now"></div>
      <div class="radio-find">
        <input id="radio-q" type="search" autocomplete="off" enterkeyhint="search" data-i18n-ph="radioSearch" placeholder="Search stations">
      </div>
      <div id="radio-body" class="radio-body"></div>
    </dialog>

    <!-- Play view: badges -->
    <dialog id="score-dlg" class="score-dlg" aria-labelledby="score-title">
      <div class="sos-head">
        <h2 id="score-title" data-i18n="playTitle">Your badges</h2>
        <button class="icon-btn" id="score-close" aria-label="Close" data-i18n-aria="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div id="score-body"></div>
    </dialog>

    <div class="toast" id="toast" role="status" hidden></div>
  </div>
  <script type="module" src="/src/main.js"></script>
  <!-- Vercel Web Analytics: cookieless, aggregate visitor counts (enable in Vercel → Project → Analytics) -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
