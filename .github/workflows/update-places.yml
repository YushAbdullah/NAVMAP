name: Update places data

on:
  schedule:
    - cron: '0 18 * * 0'   # every Monday 02:00 Malaysia time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-places
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Malaysia places from OpenStreetMap
        run: node scripts/build-pois.mjs
      - name: Commit if changed
        run: |
          git config user.name "navmap-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/poi
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update places data from OpenStreetMap"
            # main may have moved while the build ran (it takes a few minutes): rebase and retry
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep $((i * 10))
            done
          fi
