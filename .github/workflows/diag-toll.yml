name: Toll data build and live check (temporary)
on:
  push:
    branches: [claude/project-thread-za50y5]
    paths: [scripts/build-tolls.mjs, scripts/check-tolls.mjs, src/lib/tolls.js, src/lib/routing.js, .github/workflows/diag-toll.yml]
permissions:
  contents: write
concurrency:
  group: diag-toll
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-tolls.mjs
        continue-on-error: true
      - run: node scripts/check-tolls.mjs
        continue-on-error: true
      - run: |
          git config user.name "navmap-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/tolls.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "no toll data"; else
            git commit -m "Add toll expressway points from OpenStreetMap"
            git pull --rebase origin claude/project-thread-za50y5 && git push origin HEAD:claude/project-thread-za50y5
          fi
